name: tests

# imev は Windows 上の IME(Mozc へのパッチ + PoC)で、Mozc 本体のビルドは
# Bazel + MSVC + Qt で数十分〜数時間かかるため CI には載せない。
# ここでは「数分で回り、壊れていれば確実に赤になる」検査だけを回す。
# ビルド・導入・実機での変換確認はローカルで行う(wiki/operations/mozc-build-install.md)。
#
# main はブランチ保護で、ジョブ名 checks と mozc-patch を必須チェックにしている。
# ジョブ名(jobs: 直下のキー)を変えるときは .github/branch-protection.json と GitHub 側の保護設定も
# 直すこと。ずれると必須チェックが実行されず、PR が永久に pending になる(wiki/overview.md「運用」)。
#
# どの検査も「対象が 0 件で成功」に落ちないようにしてある。
# 黙って何も見ていない緑の CI は、赤い CI より気づきにくい。

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python の構文
        run: |
          count=$(find . -name '*.py' -not -path './.git/*' | wc -l)
          echo "検査した .py: $count 件"
          if [ "$count" -eq 0 ]; then
            echo "::error::検査対象の .py が 1 件も見つからない(パスか除外条件が壊れている)"
            exit 1
          fi
          find . -name '*.py' -not -path './.git/*' -print0 | xargs -0 python -m py_compile

      - name: ブランチ保護の必須チェック名とジョブ名の一致
        # 一致しないと必須チェックが実行されず、PR が永久に pending になる。
        # 検査できるのは branch-protection.json とこのファイルの整合まで。GitHub 側の設定との食い違いは見えない。
        run: |
          python - <<'PY'
          import json, re, sys
          contexts = json.load(open('.github/branch-protection.json', encoding='utf-8'))['required_status_checks']['contexts']
          workflow = open('.github/workflows/test.yml', encoding='utf-8').read()
          jobs = re.findall(r'^  ([A-Za-z0-9_-]+):\s*$', workflow.split('\njobs:\n', 1)[1], re.M)
          print('必須チェック:', contexts, '/ ジョブ:', jobs)
          if not contexts:
              sys.exit('::error::必須チェックが 0 件(branch-protection.json の読み取りが壊れている)')
          missing = [c for c in contexts if c not in jobs]
          if missing:
              sys.exit(f'::error::必須チェック {missing} に対応するジョブが test.yml に無い。ジョブ名を変えたなら branch-protection.json と GitHub 側の保護設定も直す')
          PY

      - name: agy レビューの回帰テスト
        run: |
          pip install pytest
          python -m pytest review/tests -q

      - name: Wiki 差し込み hook のテスト
        # ディレクトリ指定(node --test .claude/hooks/test)は Windows の node で拾えないため、ファイルを並べる。
        run: node --test .claude/hooks/test/*.test.mjs

      - name: シェルスクリプトの構文
        run: |
          status=0
          count=0
          while IFS= read -r file; do
            count=$((count + 1))
            bash -n "$file" || status=1
          done < <(find . -name '*.sh' -not -path './.git/*')
          echo "検査した .sh: $count 件"
          if [ "$count" -eq 0 ]; then
            echo "::error::検査対象の .sh が 1 件も見つからない(パスか除外条件が壊れている)"
            status=1
          fi
          exit $status

      - name: PowerShell の構文と BOM
        shell: pwsh
        run: |
          # BOM が無いと Windows PowerShell 5.1 が CP932 として読み、日本語が化けてパースエラーで落ちる。
          # pwsh 7 は BOM 無しでも読めるので、構文の検査とは別に BOM を見る。
          $failed = $false
          $files = @(Get-ChildItem -Recurse -File -Include *.ps1, *.ps1.example)
          Write-Host "検査した PowerShell: $($files.Count) 件"
          if ($files.Count -lt 1) {
            Write-Host "::error::検査対象の .ps1 が 1 件も見つからない(パスか除外条件が壊れている)"
            exit 1
          }
          foreach ($file in $files) {
            $errors = $null
            # .example は拡張子が .ps1 でないため、内容を読んでパースする
            $text = Get-Content -LiteralPath $file.FullName -Raw
            [System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              foreach ($e in $errors) {
                Write-Host "::error file=$($file.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
              $failed = $true
            }
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              Write-Host "::error file=$($file.FullName)::UTF-8 BOM が無い"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  mozc-patch:
    # パッチが基準コミットの google/mozc にそのまま当たるか。ビルドはしない。
    # 基準コミットを上げるときは 02_src/mozc/mozc-base-commit.txt だけを書き換える。
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 基準コミットの google/mozc を取得
        run: |
          base=$(tr -d '[:space:]' < 02_src/mozc/mozc-base-commit.txt)
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error file=02_src/mozc/mozc-base-commit.txt::40 桁のコミット SHA ではない: '$base'"
            exit 1
          fi
          git init -q mozc
          git -C mozc fetch -q --depth 1 --filter=blob:none https://github.com/google/mozc.git "$base"
          # パッチが触るのは src/rewriter 配下だけ。Mozc 全体の blob は取らない
          git -C mozc sparse-checkout set src/rewriter
          git -C mozc checkout -q FETCH_HEAD
          echo "google/mozc $(git -C mozc rev-parse HEAD)"

      - name: git apply --check
        run: git -C mozc apply --check --verbose "$GITHUB_WORKSPACE/02_src/mozc/context-rerank.patch"
